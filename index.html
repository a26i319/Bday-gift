<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise Gift!!!</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/css/styles.css">
</head>
<body>

    <!-- SCREEN: Passcode -->
<div class="screen active" id="screen-passcode">
  <!-- Floating bubbles -->
  <div class="bubbles" id="bubbles"></div>

  <!-- Nav -->
  <nav class="pc-nav">
    <a href="#" class="active">passcode</a>
    <a href="#">greeting</a>
    <a href="#">choice</a>
    <a href="#">gifts</a>
    <a href="#">cake</a>
    <a href="#">miss us</a>
    <a href="#">letter</a>
  </nav>

  <main class="pc-main">
    <!-- LEFT -->
    <div class="pc-left">
      <div class="polaroid-wrap">
        <!-- Bow SVG -->
        <svg class="bow-svg" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="35" cy="40" rx="32" ry="22" fill="#ffd6e7" transform="rotate(-20 35 40)"/>
          <ellipse cx="85" cy="40" rx="32" ry="22" fill="#ffd6e7" transform="rotate(20 85 40)"/>
          <ellipse cx="35" cy="40" rx="18" ry="13" fill="#ffe8f2" transform="rotate(-20 35 40)"/>
          <ellipse cx="85" cy="40" rx="18" ry="13" fill="#ffe8f2" transform="rotate(20 85 40)"/>
          <circle cx="60" cy="40" r="12" fill="#ffb3cf"/>
          <circle cx="60" cy="40" r="6" fill="#ffd6e7"/>
        </svg>
        <div class="polaroid">
          <div class="polaroid-img">
            <img src="./src/img/cutie-pie.jpg" alt="Polaroid Image">
          </div>
        </div>
      </div>

      <!-- Bear SVG -->
      <div class="bear-wrap">
        <svg class="bear-svg" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
          <circle cx="55" cy="65" r="28" fill="#fff0f5"/>
          <circle cx="145" cy="65" r="28" fill="#fff0f5"/>
          <circle cx="55" cy="65" r="16" fill="#ffe8f2"/>
          <circle cx="145" cy="65" r="16" fill="#ffe8f2"/>
          <ellipse cx="100" cy="175" rx="68" ry="72" fill="#fff0f5"/>
          <circle cx="100" cy="100" r="62" fill="#fff0f5"/>
          <circle cx="80" cy="95" r="8" fill="#ff97b7"/>
          <circle cx="120" cy="95" r="8" fill="#ff97b7"/>
          <circle cx="82" cy="93" r="3" fill="white"/>
          <circle cx="122" cy="93" r="3" fill="white"/>
          <ellipse cx="100" cy="112" rx="10" ry="7" fill="#ffb3cf"/>
          <path d="M90 120 Q100 130 110 120" stroke="#ff97b7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <ellipse cx="100" cy="178" rx="40" ry="44" fill="#ffe8f2"/>
          <polygon points="78,210 100,222 78,234" fill="#f4a7c0"/>
          <polygon points="122,210 100,222 122,234" fill="#f4a7c0"/>
          <circle cx="100" cy="222" r="6" fill="#e8789a"/>
          <rect x="72" y="42" width="56" height="10" rx="5" fill="#ff97b7"/>
          <rect x="82" y="14" width="36" height="32" rx="6" fill="#ffd6e7"/>
          <rect x="85" y="36" width="30" height="6" rx="3" fill="#ffe8f2"/>
        </svg>
      </div>
    </div>

    <!-- Right section -->
        <div class="pc-right">
      <div class="pc-title">Entre a passcode</div>
      <div class="pc-hint">hint: our birth year!!</div>
      <div class="pc-display" id="passcode-display">
        <div class="pc-slot" id="dot-0">✱</div>
        <div class="pc-slot" id="dot-1">✱</div>
        <div class="pc-slot" id="dot-2">✱</div>
        <div class="pc-slot" id="dot-3">✱</div>
      </div>
      <div class="keypad" id="keypad">
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        <button class="key sym" onclick="pressKey('*')">✱</button>
        <button class="key" onclick="pressKey('0')">0</button>
        <button class="key sym" onclick="clearLast()">⌫</button>
        </div>
      <div class="pc-msg" id="pc-msg"></div>
      <!-- NEXT button: hidden until correct passcode, then appears with animation -->
      <button class="pc-next-btn" id="pc-next" onclick="goTo('screen-greeting')">Next →</button>
    </div>
    </main>
</div>


<!-- SCREEN: Greeting -->
<div class="screen" id="screen-greeting">
  <div class="greeting-content">
    <div class="balloons">
      <div class="balloon">🎈</div>
      <div class="balloon">🎈</div>
      <div class="balloon">🎈</div>
    </div>
    <!-- <div class="hb-title">🎉 Happy Birthday! 🎉</div> -->
    <img 
      src="./src/img/bd.gif" 
      alt="Happy Birthday" 
      class="hb-gif"
    >
    
    <button class="btn-main btn-blue" onclick="goTo('screen-choice')">Next →</button>
  </div>
</div>

<!-- SCREEN: CHOICE -->
<div class="screen" id="screen-choice">
    <div class="choice-content">
      <div class="choice-title">Are You Ready?<br>For a Surprise? 🎀</div>
      <img src="./src/img/choice.gif" alt="cute bear" class="choice-gif">
      <div class="choice-buttons">
        <button class="btn-choice btn-yes" onclick="goTo('screen-gifts')">YES!! ❤️</button>
        <button class="btn-choice btn-no" onclick="clickNo()">NO!!</button>
      </div>
    </div>
</div>

<!-- SCREEN: DARE(first NO) -->
<div class="screen" id="screen-dare">
  <div class="dare-content">
    <div class="dare-title">HOW DARE YOU!</div>
    <img src="./src/img/angry.gif" alt="angry" class="dare-gif">
    <button class="btn-choice btn-tryagain" onclick="goTo('screen-choice')">TRY AGAIN</button>
  </div>
</div>

<!-- SCREEN: SUPER DARE(second NO) -->
<div class="screen" id="screen-superdare">
    <div class="dare-content">
      <div class="dare-title" style="color: #c0392b;">ARE YOU REALLY SERIOUS?😾</div>
      <img src="./src/img/sp-angry.gif" alt="very angry" class="dare-gif">
    <p class="dare-subtitle">You better click YES this time!!</p>
    <button class="btn-choice btn-tryagain" onclick="goTo('screen-choice')">TRY AGAIN</button>
    </div>
</div>

<div class="screen" id="screen-gifts">
  <div class="gifts-content">
    <div class="gifts-title" id="gifts-title">
    </div>
    
    <div class="gift-boxes" id="gift-boxes">
      <div class="gift-box" id="box-0" onclick="openGift(0)" >
        <img src="./src/img/redbox.png" alt="gift1" class="gift-img">
      </div>
      <div class="gift-box" id="box-1" onclick="openGift(1)" >
        <img src="./src/img/redbox.png" alt="gift2" class="gift-img">
      </div>
      <div class="gift-box" id="box-2" onclick="openGift(2)" >
        <img src="./src/img/redbox.png" alt="gift3" class="gift-img">
      </div>
    </div>
    <div class="gifts-subtitle" id="gifts-subtitle"></div>
    <div class="gift-reveal" id="gift-reveal"></div>
    <div class="gifts-subtitle" id="gifts-subtitle"></div>
  </div>
</div>




<!-- Screen : Cake -->
<div class="screen" id="screen-cake">
  <div class="confetti-container" id="confetti-container"></div>
  <div class="cake-content">
    <div class="make-wish-text" id="make-wish-text">Make a wish ✨</div>
    <div class="stars-container" id="stars-container"></div>

    <div class="cake-wrapper">
      <div class="candles-row" id="candles-row">
        <div class="candle"><div class="flame" id="f0"></div><div class="wick"></div><div class="candle-body" style="background:#ff97b7"></div></div>
        <div class="candle"><div class="flame" id="f1"></div><div class="wick"></div><div class="candle-body" style="background:#5bb8f5"></div></div>
        <div class="candle"><div class="flame" id="f2"></div><div class="wick"></div><div class="candle-body" style="background:#ffd700"></div></div>
        <div class="candle"><div class="flame" id="f3"></div><div class="wick"></div><div class="candle-body" style="background:#ff97b7"></div></div>
        <div class="candle"><div class="flame" id="f4"></div><div class="wick"></div><div class="candle-body" style="background:#5bb8f5"></div></div>
      </div>
      <img src="./src/img/cake.png" alt="Birthday Cake" class="cake-img">
    </div>

    <button class="blow-btn" id="blow-btn" onclick="blowCandles()">💨 BLOW!</button>
    <div class="wish-msg" id="wish-msg"></div>
    <button class="btn-back hidden" id="btn-back-cake" onclick="goTo('screen-gifts')">Back</button>
  </div>
  <div class="confetti-container" id="confetti-container"></div>    
</div>
<!-- SCREEN: Photo Gallery -->

<div class="screen" id="screen-photo-gallery">

  <div class="grain-overlay"></div>
  <div class="sparkle-layer" id="sparkle-layer"></div>

  <div class="gallery-scroll-wrap">
    <div class="gallery-inner">

      <div class="gallery-top-title">✨ our memories ✨</div>

      <!-- FILM STRIP 1 -->
      <div class="film-strip strip-1">
        <div class="sprockets left">
          <div class="hole"></div><div class="hole"></div><div class="hole"></div>
          <div class="hole"></div><div class="hole"></div><div class="hole"></div>
        </div>
        <div class="strip-photos">
          <div class="strip-photo" onclick="openModal(0)">
            <img src="./src/img/photosession/gorgerous.jpg" alt="memory 1">
            <div class="tape tape-a"></div>
          </div>
          <div class="strip-photo" onclick="openModal(1)">
            <img src="./src/img/photosession/honeypie.jpg" alt="memory 2">
          </div>
          <div class="strip-photo" onclick="openModal(2)">
            <img src="./src/img/photosession/smile.jpg" alt="memory 3">
            <div class="tape tape-b"></div>
          </div>
        </div>
        <div class="sprockets right">
          <div class="hole"></div><div class="hole"></div><div class="hole"></div>
          <div class="hole"></div><div class="hole"></div><div class="hole"></div>
        </div>
      </div>

      <div class="between-tape tape-between-1"></div>
      <div class="between-tape tape-between-2"></div>

      <!-- FILM STRIP 2 -->
      <div class="film-strip strip-2">
        <div class="sprockets left">
          <div class="hole"></div><div class="hole"></div><div class="hole"></div>
          <div class="hole"></div><div class="hole"></div><div class="hole"></div>
        </div>
        <div class="strip-photos">
          <div class="strip-photo" onclick="openModal(3)">
            <img src="./src/img/photosession/cutie.jpg" alt="memory 4">
          </div>
          <div class="strip-photo" onclick="openModal(4)">
            <img src="./src/img/photosession/pretty-girl.jpg" alt="memory 5">
          </div>
          <div class="strip-photo" onclick="openModal(5)">
            <img src="./src/img/photosession/airport.jpg" alt="memory 6">
            <div class="tape tape-c"></div>
          </div>
        </div>
        <div class="overlap-photo" onclick="openModal(4)">
          <img src="./src/img/photosession/pretty-girl.jpg" alt="memory 5">
          <div class="tape tape-overlap-top"></div>
          <div class="tape tape-overlap-bot"></div>
        </div>
        <div class="sprockets right">
          <div class="hole"></div><div class="hole"></div><div class="hole"></div>
          <div class="hole"></div><div class="hole"></div><div class="hole"></div>
        </div>
      </div>

      <div class="between-tape tape-between-3"></div>

      <div class="gallery-footer-row">
        <p class="gallery-hint">tap any photo to open 📸</p>
        <button class="btn-back" onclick="goTo('screen-gifts')">← Back</button>
      </div>

    </div>
  </div>

  <!-- MODAL -->
  <div class="gallery-modal" id="gallery-modal" onclick="closeModal()">
    <div class="modal-inner" onclick="event.stopPropagation()">
      <button class="modal-x" onclick="closeModal()">✕</button>
      <img id="modal-img" src="" alt="">
      <p id="modal-cap" class="modal-cap"></p>
    </div>
  </div>

</div>



<!-- Music button -->
<button class="music-btn" id="music-btn" onclick="toggleMusic()" title="Toggle music">🎵</button>
<div class="toast" id="toast"></div>
<!-- SCREEN: GIFTS -->



<!-- Background music -->
<audio id="bg-music" loop>
  <source src="./src/music/「Crush_-_Tessa_Violet__lyrics_🍭」(256k).mp3" type="audio/mp3">
</audio>

<script src="./src/js/app.js"></script> 
</body>

</html>
